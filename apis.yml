aid: experic
name: Experic
description: Experic is a specialist powder-handling contract development and manufacturing
  organization (CDMO) founded in 2018, headquartered in Cranbury, New Jersey, with an
  EU clinical supply center in Ireland. The company provides process, analytical and
  formulation development, clinical and commercial cGMP manufacturing, dry powder
  inhalation (DPI) and capsule/powder dosing, autoinjector and pen assembly, and clinical
  trial packaging, labeling, storage and logistics. Experic is a physical-goods
  manufacturing and clinical supply services business; it publishes no public developer
  program, API documentation, or machine-readable API contract.
